<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="A settlement arrives from the payments feed, lands in the ledger and closes itself under an existing seal">
  <rect width="900" height="240" fill="#f3ecdf"/>

  <!-- the open ledger, three settled rows and one arriving -->
  <line x1="118" y1="20" x2="118" y2="220" stroke="#e9e0cd" stroke-width="1"/>
  <g stroke="#e9e0cd" stroke-width="1">
    <line x1="24" y1="60" x2="560" y2="60"/>
    <line x1="24" y1="108" x2="560" y2="108"/>
    <line x1="24" y1="156" x2="560" y2="156"/>
    <line x1="24" y1="212" x2="560" y2="212"/>
  </g>
  <g fill="#221d16" opacity="0.34">
    <rect x="140" y="38" width="196" height="9"/>
    <rect x="140" y="86" width="164" height="9"/>
    <rect x="140" y="134" width="212" height="9"/>
  </g>
  <g fill="#221d16" opacity="0.28">
    <rect x="420" y="39" width="86" height="7"/>
    <rect x="420" y="87" width="68" height="7"/>
    <rect x="420" y="135" width="94" height="7"/>
  </g>

  <!-- the arriving row: sealed in the margin, closed in forest, no human on it -->
  <rect x="24" y="182" width="4" height="16" fill="#2d4fd1"/>
  <g fill="#2d4fd1">
    <circle cx="70" cy="190" r="14"/>
    <circle cx="84" cy="190" r="3.9"/>
    <circle cx="81.4" cy="181.8" r="3.9"/>
    <circle cx="74.4" cy="176.8" r="3.9"/>
    <circle cx="65.6" cy="176.8" r="3.9"/>
    <circle cx="58.6" cy="181.8" r="3.9"/>
    <circle cx="56" cy="190" r="3.9"/>
    <circle cx="58.6" cy="198.2" r="3.9"/>
    <circle cx="65.6" cy="203.2" r="3.9"/>
    <circle cx="74.4" cy="203.2" r="3.9"/>
    <circle cx="81.4" cy="198.2" r="3.9"/>
  </g>
  <circle cx="70" cy="190" r="9.8" fill="none" stroke="#f3ecdf" stroke-width="2"/>
  <circle cx="70" cy="190" r="4.1" fill="#f3ecdf"/>
  <rect x="140" y="185" width="180" height="9" fill="#221d16" opacity="0.72"/>
  <rect x="420" y="186" width="88" height="7" fill="#2e5c3a"/>

  <!-- the money coming in off the feed -->
  <rect x="712" y="160" width="164" height="60" fill="#faf6ee" stroke="#e9e0cd" stroke-width="1"/>
  <rect x="732" y="178" width="96" height="10" fill="#2e5c3a"/>
  <rect x="732" y="198" width="60" height="7" fill="#221d16" opacity="0.34"/>
  <line x1="704" y1="190" x2="600" y2="190" stroke="#221d16" stroke-width="1.4"/>
  <polygon points="588,190 604,182 604,198" fill="#221d16"/>

  <!-- the feed above it, still holding money that is not short and cannot close -->
  <g stroke="#e9e0cd" stroke-width="1">
    <line x1="712" y1="60" x2="876" y2="60"/>
    <line x1="712" y1="108" x2="876" y2="108"/>
  </g>
  <g fill="#221d16" opacity="0.24">
    <rect x="712" y="38" width="112" height="8"/>
    <rect x="712" y="86" width="94" height="8"/>
  </g>
</svg>
