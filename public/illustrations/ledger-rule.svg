<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="A ruled close queue: three entries closed under one precedent seal, five still open">
  <rect width="900" height="280" fill="#f3ecdf"/>

  <!-- margin rule, the way a case reporter separates the seal column -->
  <line x1="118" y1="16" x2="118" y2="264" stroke="#e9e0cd" stroke-width="1"/>

  <g stroke="#e9e0cd" stroke-width="1">
    <line x1="24" y1="48" x2="876" y2="48"/>
    <line x1="24" y1="80" x2="876" y2="80"/>
    <line x1="24" y1="112" x2="876" y2="112"/>
    <line x1="24" y1="144" x2="876" y2="144"/>
    <line x1="24" y1="176" x2="876" y2="176"/>
    <line x1="24" y1="208" x2="876" y2="208"/>
    <line x1="24" y1="240" x2="876" y2="240"/>
  </g>

  <!-- closed entries: forest bar in the margin, ink body, forest amount -->
  <g fill="#2e5c3a">
    <rect x="24" y="27" width="4" height="14" />
    <rect x="24" y="59" width="4" height="14" />
    <rect x="24" y="91" width="4" height="14" />
    <rect x="700" y="30" width="96" height="8" />
    <rect x="700" y="62" width="118" height="8" />
    <rect x="700" y="94" width="82" height="8" />
  </g>
  <g fill="#221d16" opacity="0.72">
    <rect x="140" y="29" width="210" height="9" />
    <rect x="140" y="61" width="252" height="9" />
    <rect x="140" y="93" width="186" height="9" />
  </g>

  <!-- the seal stamped in the margin: one precedent, three entries -->
  <g fill="#2d4fd1">
    <circle cx="82" cy="66" r="17"/>
    <circle cx="99" cy="66" r="4.8"/>
    <circle cx="95.8" cy="56" r="4.8"/>
    <circle cx="87.3" cy="49.8" r="4.8"/>
    <circle cx="76.7" cy="49.8" r="4.8"/>
    <circle cx="68.2" cy="56" r="4.8"/>
    <circle cx="65" cy="66" r="4.8"/>
    <circle cx="68.2" cy="76" r="4.8"/>
    <circle cx="76.7" cy="82.2" r="4.8"/>
    <circle cx="87.3" cy="82.2" r="4.8"/>
    <circle cx="95.8" cy="76" r="4.8"/>
  </g>
  <circle cx="82" cy="66" r="12" fill="none" stroke="#f3ecdf" stroke-width="2.2"/>
  <circle cx="82" cy="66" r="5" fill="#f3ecdf"/>

  <!-- still open: no seal in the margin, ink body, ochre amount -->
  <g fill="#221d16" opacity="0.34">
    <rect x="140" y="125" width="228" height="9" />
    <rect x="140" y="157" width="166" height="9" />
    <rect x="140" y="189" width="244" height="9" />
    <rect x="140" y="221" width="198" height="9" />
    <rect x="140" y="253" width="212" height="9" />
  </g>
  <g fill="#b06a12">
    <rect x="700" y="126" width="104" height="8" />
    <rect x="700" y="158" width="88" height="8" />
    <rect x="700" y="190" width="126" height="8" />
    <rect x="700" y="222" width="72" height="8" />
    <rect x="700" y="254" width="110" height="8" />
  </g>
</svg>
